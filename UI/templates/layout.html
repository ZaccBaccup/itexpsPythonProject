<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareerBuilder App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            display: flex;
            min-height: 100vh;
            background-color: #f4f7f6;
            margin: 0;
        }
        #sidebar {
            width: 250px;
            background: #212226;
            color: white;
            padding-top: 20px;
            position: fixed;
            height: 100vh;
        }
        #main-content {
            margin-left: 250px; /* This matches the sidebar width */
            flex-grow: 1;
            padding: 40px;
        }
        .nav-link {
            color: #adb5bd;
            padding: 15px 20px;
        }
        .nav-link:hover {
            color: white;
            background: #343a40;
        }
        .nav-link.active {
            background: #0d6efd;
            color: white;
        }
        .chart-img {
            width: 100%;
            max-width: 600px;
            height: auto;
        }
        tr.editing {
            background-color: #fff3cd;
        }
.question-box {
    white-space: pre-wrap;   /* preserves line breaks but allows wrapping */
    word-wrap: break-word;   /* breaks long words if needed */
    overflow-wrap: break-word;
    text-align: left;
}
    </style>
</head>
<body>

    <div id="sidebar">
        <div class="px-3 mb-4">
            <img src="{{ url_for('static', filename='logo.png') }}" width="50">
            <img src="{{ url_for('static', filename='group1.png') }}" width="150"><br><br>
            <h3>CareerFlow</h3>
        </div>
        <nav class="nav flex-column">
            <!-- using url_for function so Flask will look for the name of the Python function in app.py -->
            <a class="nav-link" href="{{ url_for('dashboard') }}">Dashboard</a>
            <a class="nav-link" href="{{ url_for('resume') }}">Resume Builder</a>
            <a class="nav-link" href="{{ url_for('jobtracker') }}">Job Tracker</a>
            <a class="nav-link" href="{{ url_for('interviewprep') }}">Interview Prep</a>
        </nav>
    </div>

    <div id="main-content">
        {% block content %}
        {% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
