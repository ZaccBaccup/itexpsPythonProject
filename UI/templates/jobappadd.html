{% extends "layout.html" %} <!-- template inheritance tag -->

{% block content %} <!-- block tag in Jinja2 (the template engine Flask uses) -->
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Job Application Tracker</h2>
</div>
<div class="card shadow-sm">
    <form action="{{ url_for('jobappadd') }}" method="POST" enctype="multipart/form-data">
        <div class="card-body">
            <table class="table table-hover">
                <tr><td colspan="2"><h4>Add New Job Application</h4></td></tr>
                <tr>
                    <td><b>Company <font color="red">*</font></b></td>
                    <td><input type="text" name="app_company" size="50" required></td>
                </tr>
                <tr>
                    <td><b>Role <font color="red">*</font></b></td>
                    <td><input type="text" name="app_role" size="50" required></td>
                </tr>
                <tr>
                    <td><b>Date Applied <font color="red">*</font></b></td>
                    <td><input type="date" name="app_date" required></td>
                </tr>
                <tr>
                    <td><b>Status</b></td>
                    <td>
                        <select name="app_status">
                            <option value="Applied" selected>Applied</option>
                            <option value="Interviewed">Interviewed</option>
                            <option value="Rejected">Rejected</option>
                        </select>
                    <td>
                </tr>
                <tr>
                    <td><b>Contact Name</b></td>
                    <td><input type="text" name="app_cname" size="40"></td>
                </tr>
                <tr>
                    <td><b>Contact Email</b></td>
                    <td><input type="text" name="app_cemail" size="40"></td>
                </tr>
                <tr>
                    <td><b>Job Link</b></td>
                    <td><input type="text" name="app_joblink" size="50"></td>
                </tr>
                <tr>
                    <td colspan="2">
                        <input type="submit" class="btn btn-primary" value="Save">&nbsp;
                        <button onclick="history.back()" class="btn btn-primary">Cancel</button>
                    </td>
                </tr>
            </table>
        </div>
    </form?
</div>
{% endblock %}
