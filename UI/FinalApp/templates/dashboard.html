{% extends "layout.html" %} <!-- template inheritance tag -->

{% block content %} <!-- block tag in Jinja2 (the template engine Flask uses) -->
<div class="container">
    <h2 class="mb-4">Job Applications Overview</h2>
    <p class="lead mt-2">Did you apply for a job today?&nbsp;&nbsp;<a href="{{ url_for('jobappadd') }}"><button class="btn btn-primary">Yes</button></a></p>
</div>

<!-- embed streamlit app -->
<div class="mt-4">
    <iframe 
        src="http://localhost:8501" 
        width="100%" 
        height="1450px"
        style="border:none; border-radius:10px;">
    </iframe>
</div>

{% endblock %}
