{% extends "layout.html" %} <!-- template inheritance tag -->

{% block content %} <!-- block tag in Jinja2 (the template engine Flask uses) -->
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Job Application Tracker</h2>
</div>
<div class="card shadow-sm" id="formx">
    <form method="POST">
        <div class="card-body">
            <table>
                <tr><td colspan="2"><h4>Edit Job Application Details</h4></td></tr>
                <tr>
                    <td><b>Company <font color="red">*</font></b></td>
                    <td><input type="text" name="company" value="{{ job.company }}" size="50" required></td>
                </tr>
                <tr>
                    <td><b>Role <font color="red">*</font></b></td>
                    <td><input type="text" name="role" value="{{ job.role }}" size="50" required></td>
                </tr>
                <tr>
                    <td><b>Date Applied <font color="red">*</font></b></td>
                    <td><input type="date" name="date" value="{{ job.date }}" required></td>
                </tr>
                <tr>
                    <td><b>Status</b></td>
                    <td>
                        <select name="status">
                            <option value="Applied" {{ 'selected' if job.status == 'Applied' else '' }}>Applied</option>
                            <option value="Interview Scheduled" {{ 'selected' if job.status == 'Interview Scheduled' else '' }}>Interview Scheduled</option>
                            <option value="Interviewed" {{ 'selected' if job.status == 'Interviewed' else '' }}>Interviewed</option>
                            <option value="Offer Received" {{ 'selected' if job.status == 'Offer Received' else '' }}>Offer Received</option>
                            <option value="Rejected" {{ 'selected' if job.status == 'Rejected' else '' }}>Rejected</option>
                            <option value="Withdrawn" {{ 'selected' if job.status == 'Withdrawn' else '' }}>Withdrawn</option>
                        </select>
                    <td>
                </tr>
                <tr>
                    <td><b>Contact Name</b></td>
                    <td><input type="text" name="cname" value="{{ job.cname }}" size="40"></td>
                </tr>
                <tr>
                    <td><b>Contact Email</b></td>
                    <td><input type="text" name="cemail" value="{{ job.cemail }}" size="40"></td>
                </tr>
                <tr>
                    <td><b>Job Link</b></td>
                    <td><input type="text" name="joblink" value="{{ job.joblink }}" size="50"></td>
                </tr>
                <tr>
                    <td><b>Followed Up?</b></td>
                    <td>
                        <select name="followedup">
                            <option value="0" {% if job.followedup == '0' %}selected{% endif %}>No</option>
                            <option value="1" {% if job.followedup == '1' %}selected{% endif %}>Yes</option>
                        </select>
                    </td>
                </tr>
                <tr><td colspan="2">&nbsp;</td></tr>
                <tr>
                    <td colspan="2">
                        <input type="submit" class="btn btn-primary" value="Save">&nbsp;
                        <button onclick="history.back()" class="btn btn-primary">Cancel</button>
                    </td>
                </tr>
            </table>
        </div>
    </form?
</div>
{% endblock %}
